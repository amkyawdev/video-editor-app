name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Pub get
        run: flutter pub get

      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Analyze
        run: flutter analyze

      - name: Unit and widget tests
        run: flutter test --reporter expanded

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Configure release signing (optional)
        if: ${{ env.AMKYAW_KEYSTORE_BASE64 != '' }}
        env:
          AMKYAW_KEYSTORE_BASE64: ${{ secrets.AMKYAW_KEYSTORE_BASE64 }}
        run: |
          echo "$AMKYAW_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "AMKYAW_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "AMKYAW_KEYSTORE_PASSWORD=${{ secrets.AMKYAW_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "AMKYAW_KEY_ALIAS=${{ secrets.AMKYAW_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "AMKYAW_KEY_PASSWORD=${{ secrets.AMKYAW_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Build release AAB
        run: flutter build appbundle --release

      - name: Remove temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
