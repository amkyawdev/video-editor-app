name: Android build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish a public GitHub Release (tags only)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true

      - name: Detect optional signing secret
        env:
          KEYSTORE_B64: ${{ secrets.AMKYAW_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "HAS_SIGNING=true" >> "$GITHUB_ENV"
          else
            echo "HAS_SIGNING=false" >> "$GITHUB_ENV"
          fi

      - name: Decode Firebase client config (optional, never printed)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json
            echo "Firebase client config written to android/app/google-services.json"
          else
            echo "No Firebase client config secret; continuing without it."
          fi

      - name: Decode release keystore (optional)
        if: env.HAS_SIGNING == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.AMKYAW_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.AMKYAW_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AMKYAW_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.AMKYAW_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "AMKYAW_KEYSTORE_FILE=$RUNNER_TEMP/release.jks"
            echo "AMKYAW_KEYSTORE_PASSWORD=$STORE_PASSWORD"
            echo "AMKYAW_KEY_ALIAS=$KEY_ALIAS"
            echo "AMKYAW_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Flutter version
        run: flutter --version

      - name: Pub get
        run: flutter pub get

      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib test tool test_app

      - name: Analyze
        run: flutter analyze

      - name: Unit and integration tests
        run: flutter test --reporter expanded

      - name: Build debug APK (no signing secrets configured)
        if: env.HAS_SIGNING != 'true'
        run: flutter build apk --debug

      - name: Build signed release APK(s) and AAB
        if: env.HAS_SIGNING == 'true'
        run: |
          flutter build apk --release --split-per-abi
          flutter build appbundle --release

      - name: Verify artifacts and write checksums
        run: |
          mkdir -p build/app/outputs/checksums
          if [ "$HAS_SIGNING" = "true" ]; then
            ls -l build/app/outputs/flutter-apk/*.apk
            ls -l build/app/outputs/bundle/release/app-release.aab
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | sort -V | tail -1)
            if [ -x "$BT/apksigner" ]; then
              "$BT/apksigner" verify --print-certs build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            fi
            cd build/app/outputs
            sha256sum flutter-apk/*.apk bundle/release/*.aab > checksums/SHA256SUMS.txt
          else
            ls -l build/app/outputs/flutter-apk/app-debug.apk
            cd build/app/outputs
            sha256sum flutter-apk/app-debug.apk > checksums/SHA256SUMS.txt
          fi
          cat checksums/SHA256SUMS.txt

      - name: Upload debug APK (clearly labelled non-release)
        if: env.HAS_SIGNING != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk-unsigned-release-key
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

      - name: Upload signed release artifacts
        if: env.HAS_SIGNING == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-apk-and-aab
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/checksums/SHA256SUMS.txt
          retention-days: 30

      - name: Fail tag builds without signing secrets
        if: startsWith(github.ref, 'refs/tags/') && env.HAS_SIGNING != 'true'
        run: |
          echo "::error::Release tags require AMKYAW_KEYSTORE_BASE64, AMKYAW_KEYSTORE_PASSWORD, AMKYAW_KEY_ALIAS and AMKYAW_KEY_PASSWORD secrets. Refusing to publish a debug-signed build as production."
          exit 1

      - name: Publish public GitHub Release
        if: startsWith(github.ref, 'refs/tags/') && env.HAS_SIGNING == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/checksums/SHA256SUMS.txt

      - name: Remove temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
