name: Release APK and AAB

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --reporter expanded

      - name: Configure release signing
        env:
          AMKYAW_KEYSTORE_BASE64: ${{ secrets.AMKYAW_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$AMKYAW_KEYSTORE_BASE64" ]; then
            echo "$AMKYAW_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "AMKYAW_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "AMKYAW_KEYSTORE_PASSWORD=${{ secrets.AMKYAW_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "AMKYAW_KEY_ALIAS=${{ secrets.AMKYAW_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "AMKYAW_KEY_PASSWORD=${{ secrets.AMKYAW_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          fi

      - name: Build split APKs
        run: flutter build apk --release --split-per-abi

      - name: Build AAB
        run: flutter build appbundle --release

      - name: Remove temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Checksums
        run: |
          cd build/app/outputs
          sha256sum flutter-apk/*.apk bundle/release/*.aab > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab
            build/app/outputs/SHA256SUMS.txt
          generate_release_notes: true
