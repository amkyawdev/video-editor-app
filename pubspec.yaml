name: video_editor_app
description: "Amkyaw Studio - local-first mobile video and subtitle editor."
publish_to: 'none'
version: 1.0.2+3

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State + storage
  provider: ^6.1.5
  path_provider: ^2.1.6
  path: ^1.9.1
  shared_preferences: ^2.5.6
  uuid: ^4.5.1
  collection: ^1.19.1
  intl: ^0.20.2

  # Media + platform
  file_picker: ^13.4.1
  video_player: ^2.14.1
  wakelock_plus: ^1.4.0

  # Render / probe: FFmpeg 8 with libass, libx264/libx265 (GPL build)
  ffmpeg_kit_flutter_new: ^5.0.0

  # Offline GGUF translation (llama.cpp via native build hooks)
  llamadart: ^0.21.0

  # UI (Flutter 3.50 moved Material out of the framework into material_ui)
  material_ui: ^1.11.1
  flutter_animate: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-SemiBold.ttf
          weight: 600
    - family: NotoSansMyanmar
      fonts:
        - asset: assets/fonts/NotoSansMyanmar-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansMyanmar-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansMyanmar-Bold.ttf
          weight: 700
